const sessionSelect = document.getElementById("session");
const baselineToggle = document.getElementById("baseline");
const semToggle = document.getElementById("sem");

for (const label of Object.keys(DATA.sessions)) {
  const option = document.createElement("option");
  option.value = label;
  option.textContent = label;
  sessionSelect.appendChild(option);
}

function rgba(hex, alpha) {
  const value = hex.replace("#", "");
  const red = parseInt(value.slice(0, 2), 16);
  const green = parseInt(value.slice(2, 4), 16);
  const blue = parseInt(value.slice(4, 6), 16);
  return `rgba(${red}, ${green}, ${blue}, ${alpha})`;
}

function render() {
  const sessionLabel = sessionSelect.value;
  const session = DATA.sessions[sessionLabel];
  const subtractBaseline = baselineToggle.checked;
  const showSem = semToggle.checked;
  const traces = [];

  for (const [condition, metadata] of Object.entries(DATA.conditions)) {
    const series = session[condition];
    const mean = series.mean.map(value => value - (subtractBaseline ? series.baseline : 0));
    if (showSem) {
      traces.push({
        x: series.time,
        y: mean.map((value, index) => value - series.sem[index]),
        type: "scatter",
        mode: "lines",
        line: {width: 0},
        hoverinfo: "skip",
        showlegend: false,
        legendgroup: condition
      });
      traces.push({
        x: series.time,
        y: mean.map((value, index) => value + series.sem[index]),
        type: "scatter",
        mode: "lines",
        line: {width: 0},
        fill: "tonexty",
        fillcolor: rgba(metadata.color, 0.16),
        hoverinfo: "skip",
        showlegend: false,
        legendgroup: condition
      });
    }
    traces.push({
      x: series.time,
      y: mean,
      type: "scatter",
      mode: "lines",
      name: `${metadata.label} (n=${series.unit_count.toLocaleString()})`,
      line: {color: metadata.color, width: 2.4},
      legendgroup: condition,
      hovertemplate: `${metadata.label}<br>%{x:.3f} s<br>%{y:.2f} Hz<extra></extra>`
    });
  }

  const layout = {
    title: {text: sessionLabel, x: 0.01, xanchor: "left"},
    xaxis: {title: "Time from mismatch onset (s)", range: [-0.5, 1.0], zeroline: false},
    yaxis: {title: subtractBaseline ? "Baseline-corrected SDF (Hz)" : "SDF (Hz)", zeroline: true, zerolinecolor: "#94a3b8"},
    hovermode: "x unified",
    template: "plotly_white",
    margin: {l: 72, r: 30, t: 70, b: 68},
    legend: {orientation: "h", y: 1.08, x: 1, xanchor: "right", yanchor: "bottom"},
    shapes: [
      {type: "rect", xref: "x", yref: "paper", x0: 0, x1: DATA.mismatch_duration, y0: 0, y1: 1, fillcolor: "rgba(255, 209, 102, 0.22)", line: {width: 0}, layer: "below"},
      {type: "line", xref: "x", yref: "paper", x0: 0, x1: 0, y0: 0, y1: 1, line: {color: "#1f2937", width: 1.1, dash: "dash"}},
      {type: "line", xref: "x", yref: "paper", x0: DATA.mismatch_duration, x1: DATA.mismatch_duration, y0: 0, y1: 1, line: {color: "#6b7280", width: 1, dash: "dot"}}
    ]
  };

  Plotly.react("plot", traces, layout, {responsive: true, displaylogo: false, toImageButtonOptions: {format: "png", filename: "sdf_population_comparison", scale: 2}});
}

sessionSelect.addEventListener("change", render);
baselineToggle.addEventListener("change", render);
semToggle.addEventListener("change", render);
render();
</script>
